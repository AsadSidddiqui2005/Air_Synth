<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Synth - Introduction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121214;
            --border: #27272a;
            --text: #f4f4f5;
            --muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            width: 100%;
            height: 64px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .intro-container {
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.03em;
        }

        p {
            color: var(--muted);
            font-size: 1.25rem;
            max-width: 650px;
            margin: 0 auto 40px auto;
        }

        .features {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }

        .feature-tag {
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text);
        }

        .launch-btn {
            display: inline-block;
            background-color: var(--text);
            color: var(--bg);
            font-size: 1.1rem;
            font-weight: 500;
            padding: 16px 36px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .launch-btn:hover {
            background-color: #d4d4d8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-brand">Air Synth</a>
    </nav>

    <main>
        <div class="intro-container">
            <h1>Welcome to Air Synth</h1>
            <p>A web experiment that turns your computer's webcam into a musical instrument. Explore real-time hand tracking, particle physics, and audio synthesis right in your browser.</p>
            
            <div class="features">
                <div class="feature-tag">No Downloads Required</div>
                <div class="feature-tag">100% Client-Side Privacy</div>
                <div class="feature-tag">Interactive Physics</div>
            </div>

            <a href="index.html" class="launch-btn">Enter the Playground</a>
        </div>
    </main>

</body>
</html>
